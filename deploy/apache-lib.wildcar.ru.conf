# librarian MCP server: HTTPS in front of 127.0.0.1:8090 (systemd unit librarian.service).
<VirtualHost *:80>
	ServerName lib.wildcar.ru
	ServerSignature Off
	DocumentRoot /var/www/html

	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

	ErrorLog ${APACHE_LOG_DIR}/lib.error.log
	LogLevel warn
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	Include conf-available/block-exploit-probes.conf
	ServerName lib.wildcar.ru
	ServerSignature Off

	# The MCP endpoint is /mcp; every request carries its own Bearer token,
	# which Apache passes through untouched.
	# Host stays 127.0.0.1:8090: the MCP SDK rejects other hosts on a loopback
	# listener (DNS rebinding protection).
	ProxyPreserveHost Off
	ProxyRequests Off
	ProxyTimeout 300
	# Streamable HTTP may answer as an event stream: no buffering.
	ProxyPass        / http://127.0.0.1:8090/ flushpackets=on
	ProxyPassReverse / http://127.0.0.1:8090/
	RequestHeader set X-Forwarded-Proto "https"

	ErrorLog  ${APACHE_LOG_DIR}/lib.error.log
	CustomLog ${APACHE_LOG_DIR}/lib.access.log combined

	SSLEngine on
	SSLCertificateFile    /etc/letsencrypt/live/lib.wildcar.ru/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/lib.wildcar.ru/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
