{{define "head"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · Библиотека</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--fg:#1d1d1b;--muted:#6b6a66;--line:#e2e0da;--accent:#2f5d8a;--warn:#9a5b00;--warnbg:#fff4e0;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--fg:#ecebe7;--muted:#a3a29c;--line:#34332f;--accent:#8db7e2;--warn:#f0b65a;--warnbg:#3a2c12;--chip:#28303a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header .brand{font-weight:600;text-decoration:none;color:var(--fg)}
header form{margin:0}
header .who{color:var(--muted);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
main{max-width:960px;margin:0 auto;padding:16px}
.narrow{max-width:440px;margin:48px auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:17px;margin:20px 0 8px}
input[type=email],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%}
input[type=email]{width:100%}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
button.link{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline}
.muted{color:var(--muted)}
.err{color:#b3261e}
.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
details{margin:2px 0}
details>summary{cursor:pointer;padding:4px 0}
details details{margin-left:18px}
.count{color:var(--muted);font-size:14px}
.none>summary{color:var(--muted);font-style:italic}
ul.docs{list-style:none;margin:0 0 6px 18px;padding:0}
ul.docs li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
ul.docs .d{color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;font-size:13px;margin-right:4px}
.review{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:12px 0}
.review ul{margin:4px 0 0;padding-left:20px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0}
pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:0}
.page{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
@media (max-width:560px){dl.facts{grid-template-columns:1fr}dl.facts dd{margin-bottom:8px}}
</style>
</head>
<body>
{{end}}

{{define "bar"}}<header>
<a class="brand" href="/">Библиотека</a>
{{if .}}<div class="who"><span>{{.Email}}</span><form method="post" action="/logout"><button class="link">Выйти</button></form></div>{{end}}
</header>
{{end}}

{{define "foot"}}</body>
</html>
{{end}}
